name: SonarQube Analysis

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  sonarqube:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Install SonarQube Scanner tool
      run: dotnet tool install --global dotnet-sonarscanner --version 6.1.0

    - name: Add dotnet tools to PATH
      run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
      shell: bash

    # REMOVE sonar-project.properties files (fixes "sonar-project.properties files are not understood" error)
    - name: Remove sonar-project.properties files
      shell: pwsh
      run: |
        Write-Host "Removing sonar-project.properties files from repo workspace (if any)..."
        Get-ChildItem -Path . -Filter 'sonar-project.properties' -Recurse -ErrorAction SilentlyContinue |
          ForEach-Object {
            Write-Host "Removing $($_.FullName)"
            Remove-Item -LiteralPath $_.FullName -Force -ErrorAction SilentlyContinue
          }

    - name: Restore dependencies
      run: dotnet restore labu.sln

    - name: Begin SonarQube scan
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      run: dotnet-sonarscanner begin /k:"your-project-key" /o:"your-organization" /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" /d:sonar.login="${{ secrets.SONAR_TOKEN }}" /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" /d:sonar.sources="NetSdrClientApp,EchoTcpServer" /d:sonar.tests="NetSdrClientApp.Tests,EchoTcpServer.Tests" /d:sonar.projectBaseDir="${{ github.workspace }}" /d:sonar.exclusions="**/bin/**,**/obj/**"
      shell: pwsh

    - name: Build solution
      run: dotnet build labu.sln --configuration Release --no-restore

    - name: Run NetSdrClientApp tests with coverage
      run: dotnet test NetSdrClientApp.Tests/NetSdrClientApp.Tests.csproj --configuration Release --no-build --logger trx --collect:"XPlat Code Coverage" -- RunConfiguration.DeterministicRunOrder=True

    - name: Run EchoTcpServer tests with coverage
      run: dotnet test EchoTcpServer.Tests/EchoTcpServer.Tests.csproj --configuration Release --no-build --logger trx --collect:"XPlat Code Coverage" -- RunConfiguration.DeterministicRunOrder=True

    - name: Merge coverage reports
      run: |
        dotnet tool install --global dotnet-coverage --version 17.8.0
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
        dotnet-coverage merge -f opencover -o coverage.opencover.xml **/coverage.opencover.xml
      shell: bash

    # Safety: remove any sonar-project.properties again before end step
    - name: Remove sonar-project.properties files (pre-end)
      shell: pwsh
      run: |
        Get-ChildItem -Path . -Filter 'sonar-project.properties' -Recurse -ErrorAction SilentlyContinue |
          ForEach-Object {
            Write-Host "Removing $($_.FullName)"
            Remove-Item -LiteralPath $_.FullName -Force -ErrorAction SilentlyContinue
          }

    - name: End SonarQube scan
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      run: dotnet-sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}"
      shell: pwsh
